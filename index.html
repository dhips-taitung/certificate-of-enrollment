<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在學證明書批次產生系統 - 臺東縣立東海國民小學</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 標楷體字型定義 */
        @font-face {
            font-family: 'DFKai-SB';
            src: local('DFKai-SB'), local('BiauKai'), local('標楷體');
        }

        .font-kai {
            font-family: 'DFKai-SB', 'BiauKai', '標楷體', 'TW-Kai', 'Times New Roman', serif;
        }

        /* 螢幕預覽與列印版面設定 */
        @page {
            size: A4 portrait;
            margin: 0;
        }

        @media screen {
            .preview-container {
                background-color: #525659;
                padding: 24px;
            }
            .a4-page {
                width: 210mm;
                min-height: 297mm;
                background: white;
                margin: 0 auto 24px auto;
                box-shadow: 0 4px 15px rgba(0,0,0,0.35);
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                padding: 6mm 8mm;
            }
        }

        @media print {
            body {
                background: transparent;
                margin: 0;
                padding: 0;
            }
            .no-print {
                display: none !important;
            }
            .preview-container {
                padding: 0 !important;
                background: transparent !important;
            }
            .a4-page {
                width: 210mm;
                height: 297mm;
                page-break-after: always;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                padding: 6mm 8mm;
            }
        }

        /* 單張 A5 橫式證明書外框容器 */
        .cert-card {
            width: 100%;
            height: 139mm;
            border: 2.5px solid #000;
            box-sizing: border-box;
            position: relative;
            padding: 9mm 12mm 6mm 12mm;
            background: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* ---------------- 圖層順序設定 ---------------- */
        
        /* 1. 最上層 (z-index: 30)：所有文字與相片 */
        .layer-text {
            position: relative;
            z-index: 30;
            background: transparent;
        }

        /* 2. 印章圖層容器 */
        .seals-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* 官防印章（最底層 z-index: 10） */
        .seal-official-img {
            position: absolute;
            z-index: 10;
            object-fit: contain;
            opacity: 0.85;
            mix-blend-mode: multiply;
            transform: translate(-50%, -50%);
        }

        /* 校長簽名章（中間層 z-index: 20） */
        .seal-principal-img {
            position: absolute;
            z-index: 20;
            object-fit: contain;
            opacity: 0.95;
            mix-blend-mode: multiply;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

    <!-- 頂部控制列 -->
    <div class="no-print bg-white border-b shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                    🎓 在學證明書批次產生系統
                </h1>
                <p class="text-xs text-gray-500">臺東縣立東海國民小學專用版 (A4 自動合併 2 張 A5 列印)</p>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-2 rounded-lg shadow-md flex items-center gap-2 transition">
                    🖨️ 列印 / 另存為 PDF
                </button>
            </div>
        </div>
    </div>

    <!-- 後台設定與匯入區塊 -->
    <div class="no-print max-w-7xl mx-auto p-4 space-y-5">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
            
            <!-- 1. 基本設定 -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <h2 class="font-bold text-gray-700 border-b pb-2 mb-3 flex items-center gap-1.5 text-sm">
                    ⚙️ 1. 證明書基本資料
                </h2>
                <div class="space-y-2.5 text-xs">
                    <div>
                        <label class="block text-gray-600 mb-1">學校抬頭名稱</label>
                        <input type="text" id="schoolName" value="臺東縣立東海國民小學在學證明書" class="w-full border rounded px-2.5 py-1.5 focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-gray-600 mb-1">文號前綴與起始號 (自動連號)</label>
                        <div class="flex gap-2">
                            <input type="text" id="docPrefix" value="(113)東海小在證字第" class="w-2/3 border rounded px-2.5 py-1.5">
                            <input type="text" id="docStartNum" value="463-3" class="w-1/3 border rounded px-2 py-1.5 text-center font-mono">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-gray-600 mb-1">就讀學期</label>
                            <input type="text" id="termInput" value="第1學期" class="w-full border rounded px-2.5 py-1.5">
                        </div>
                        <div>
                            <label class="block text-gray-600 mb-1">發證日期</label>
                            <input type="date" id="issueDateInput" class="w-full border rounded px-2 py-1.5">
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. 照片批次匯入 -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <h2 class="font-bold text-gray-700 border-b pb-2 mb-3 flex items-center gap-1.5 text-sm">
                    🖼️ 2. 學生照片批次匯入
                </h2>
                <p class="text-[11px] text-gray-500 mb-2">請選取學生大頭照（檔名需為「<span class="text-red-500 font-bold">學生姓名.jpg</span>」）：</p>
                
                <label class="border-2 border-dashed border-gray-300 hover:border-blue-500 rounded-lg p-3 flex flex-col items-center justify-center cursor-pointer bg-gray-50 transition">
                    <span class="text-2xl mb-1">📁</span>
                    <span class="text-xs text-blue-600 font-medium">選取多張照片檔案 / 照片資料夾</span>
                    <input type="file" id="photoFilesInput" multiple accept="image/*" class="hidden" onchange="handlePhotoUpload(event)">
                </label>
                <div id="photoMatchStatus" class="mt-2 text-xs text-gray-600 font-medium">目前已載入 0 張照片</div>
            </div>

            <!-- 3. 印章與位置微調 -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <h2 class="font-bold text-gray-700 border-b pb-2 mb-3 flex items-center gap-1.5 text-sm">
                    🔴 3. 印章圖檔與位置即時微調
                </h2>
                <div class="space-y-2 text-[11px]">
                    <div class="p-2 bg-gray-50 rounded border">
                        <div class="flex justify-between font-bold text-gray-700 mb-1">
                            <span>官防大印 (最底層)</span>
                            <input type="file" accept="image/*" class="text-[10px] w-28" onchange="loadCustomImage(event, 'officialSealImg')">
                        </div>
                        <div class="grid grid-cols-3 gap-1">
                            <label>寬: <input type="number" id="sealOffW" value="52" class="w-10 border rounded px-1" oninput="renderCertificates()">mm</label>
                            <label>X: <input type="number" id="sealOffX" value="52" class="w-10 border rounded px-1" oninput="renderCertificates()">%</label>
                            <label>Y: <input type="number" id="sealOffY" value="68" class="w-10 border rounded px-1" oninput="renderCertificates()">%</label>
                        </div>
                    </div>

                    <div class="p-2 bg-gray-50 rounded border">
                        <div class="flex justify-between font-bold text-gray-700 mb-1">
                            <span>校長簽名章 (中間層)</span>
                            <input type="file" accept="image/*" class="text-[10px] w-28" onchange="loadCustomImage(event, 'principalSealImg')">
                        </div>
                        <div class="grid grid-cols-3 gap-1">
                            <label>寬: <input type="number" id="sealPrinW" value="74" class="w-10 border rounded px-1" oninput="renderCertificates()">mm</label>
                            <label>X: <input type="number" id="sealPrinX" value="55" class="w-10 border rounded px-1" oninput="renderCertificates()">%</label>
                            <label>Y: <input type="number" id="sealPrinY" value="73" class="w-10 border rounded px-1" oninput="renderCertificates()">%</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 4. 學生名冊匯入 -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <div class="flex justify-between items-center border-b pb-2 mb-3">
                <div>
                    <h2 class="font-bold text-gray-700 text-sm flex items-center gap-1.5">
                        📋 4. 學生資料快速貼上 (Excel / Google 試算表直接複製整列貼上)
                    </h2>
                    <p class="text-[11px] text-gray-500">欄位順序：<b>學生姓名、身分證字號、生日(西元如 2013-07-08)、班級(如 六年一班)、座號</b></p>
                </div>
                <div class="flex gap-2">
                    <button onclick="parsePasteData()" class="bg-green-600 hover:bg-green-700 text-white text-xs font-semibold px-3 py-1 rounded transition">
                        📥 解析文字
                    </button>
                    <button onclick="loadSampleData()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs px-2.5 py-1 rounded transition">
                        重置範例
                    </button>
                </div>
            </div>

            <textarea id="pasteArea" rows="2" placeholder="貼上範例：&#10;王小明	V123456789	2013-07-08	六年一班	01" class="w-full border rounded p-2 text-xs font-mono focus:ring-2 focus:ring-blue-500 mb-2"></textarea>

            <!-- 學生清單預覽表 -->
            <div class="overflow-x-auto max-h-48 overflow-y-auto">
                <table class="w-full text-left text-xs border">
                    <thead class="bg-gray-100 border-b sticky top-0">
                        <tr>
                            <th class="p-1.5 w-10 text-center"><input type="checkbox" id="selectAll" checked onchange="toggleSelectAll(this)"></th>
                            <th class="p-1.5">姓名</th>
                            <th class="p-1.5">身分證字號</th>
                            <th class="p-1.5">生日(西元)</th>
                            <th class="p-1.5">班級(轉換後)</th>
                            <th class="p-1.5">座號</th>
                            <th class="p-1.5">相片狀態</th>
                            <th class="p-1.5 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody" class="divide-y divide-gray-200">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 預覽與列印區域 -->
    <div class="preview-container">
        <div id="pagesOutput">
            <!-- 動態生成 A4 雙併頁面 -->
        </div>
    </div>

    <script>
        // 預設印章圖檔
        let officialSealData = 'https://drive.google.com/thumbnail?id=1JCmzJ3aUoNgm9pwQaF-bUw6PMXzCDxXU&sz=w1000';
        let principalSealData = 'https://drive.google.com/thumbnail?id=1_CMymGd3jyvqeZe7-qp2hZDkHlRsfq_R&sz=w1000';

        let photoMap = {};
        let studentList = [];

        window.addEventListener('DOMContentLoaded', () => {
            // 預設填入截圖中的發證日期（或當日）
            document.getElementById('issueDateInput').value = '2024-10-24';
            loadSampleData();
        });

        function loadSampleData() {
            studentList = [
                {
                    selected: true,
                    name: "王小明",
                    idCard: "V123456789",
                    birthday: "2013-07-08",
                    grade: "六年一班",
                    seatNo: "01",
                    photo: "https://drive.google.com/thumbnail?id=1AlwaUa9NHPqU4Lw7ysKAHTlU26VIN7pd&sz=w1000"
                }
            ];
            renderStudentTable();
            renderCertificates();
        }

        // 解析貼上的文字
        function parsePasteData() {
            const raw = document.getElementById('pasteArea').value.trim();
            if (!raw) return;

            const lines = raw.split('\n');
            studentList = [];

            lines.forEach((line) => {
                const cols = line.split(/[\t,]/).map(c => c.trim());
                if (cols.length >= 2 && cols[0]) {
                    studentList.push({
                        selected: true,
                        name: cols[0] || "",
                        idCard: cols[1] || "",
                        birthday: cols[2] || "",
                        grade: cols[3] || "六年一班",
                        seatNo: cols[4] || "",
                        photo: photoMap[cols[0]] || ""
                    });
                }
            });

            renderStudentTable();
            renderCertificates();
        }

        // 班級轉純年級
        function formatGrade(str) {
            if (!str) return "六年級";
            if (str.includes("一") || str.startsWith("1")) return "一年級";
            if (str.includes("二") || str.startsWith("2")) return "二年級";
            if (str.includes("三") || str.startsWith("3")) return "三年級";
            if (str.includes("四") || str.startsWith("4")) return "四年級";
            if (str.includes("五") || str.startsWith("5")) return "五年級";
            if (str.includes("六") || str.startsWith("6")) return "六年級";
            return str;
        }

        // 西元轉民國
        function toMinguoDate(dateStr) {
            if (!dateStr) return "中華民國102年07月08日";
            const clean = dateStr.replace(/\//g, '-');
            const parts = clean.split('-');
            if (parts.length < 3) return dateStr;
            const rocYear = parseInt(parts[0], 10) - 1911;
            const month = String(parts[1]).padStart(2, '0');
            const day = String(parts[2]).padStart(2, '0');
            return `中華民國${rocYear}年${month}月${day}日`;
        }

        // 發證日期 (字元寬距)
        function getIssueDateMinguoSpaced() {
            const val = document.getElementById('issueDateInput').value;
            if (!val) return "中 華 民 國 1 1 3 年 1 0 月 2 4 日";
            const parts = val.split('-');
            const rocYear = String(parseInt(parts[0], 10) - 1911).split('').join(' ');
            const month = String(parts[1]).padStart(2, '0').split('').join(' ');
            const day = String(parts[2]).padStart(2, '0').split('').join(' ');
            return `中 華 民 國  ${rocYear}  年  ${month}  月  ${day}  日`;
        }

        // 照片批次載入
        function handlePhotoUpload(e) {
            const files = e.target.files;
            if (!files.length) return;

            let loadedCount = 0;
            Array.from(files).forEach(file => {
                const nameWithoutExt = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
                const reader = new FileReader();
                reader.onload = (event) => {
                    photoMap[nameWithoutExt] = event.target.result;
                    
                    studentList.forEach(st => {
                        if (st.name === nameWithoutExt) {
                            st.photo = event.target.result;
                        }
                    });

                    loadedCount++;
                    if (loadedCount === files.length) {
                        document.getElementById('photoMatchStatus').innerText = `已成功載入 ${loadedCount} 張照片！`;
                        renderStudentTable();
                        renderCertificates();
                    }
                };
                reader.readAsDataURL(file);
            });
        }

        // 上傳自訂印章
        function loadCustomImage(e, type) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                if (type === 'officialSealImg') officialSealData = event.target.result;
                if (type === 'principalSealImg') principalSealData = event.target.result;
                renderCertificates();
            };
            reader.readAsDataURL(file);
        }

        function renderStudentTable() {
            const tbody = document.getElementById('studentTableBody');
            tbody.innerHTML = '';

            studentList.forEach((st, idx) => {
                const tr = document.createElement('tr');
                const hasPhoto = !!st.photo;
                tr.innerHTML = `
                    <td class="p-1.5 text-center"><input type="checkbox" ${st.selected ? 'checked' : ''} onchange="studentList[${idx}].selected = this.checked; renderCertificates();"></td>
                    <td class="p-1.5 font-bold">${st.name}</td>
                    <td class="p-1.5 font-mono">${st.idCard}</td>
                    <td class="p-1.5 font-mono">${st.birthday}</td>
                    <td class="p-1.5">${formatGrade(st.grade)}</td>
                    <td class="p-1.5">${st.seatNo}</td>
                    <td class="p-1.5">
                        <span class="inline-block px-1.5 py-0.5 rounded text-[10px] ${hasPhoto ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-400'}">
                            ${hasPhoto ? '已配對' : '無照片'}
                        </span>
                    </td>
                    <td class="p-1.5 text-center">
                        <button onclick="studentList.splice(${idx}, 1); renderStudentTable(); renderCertificates();" class="text-red-500 hover:underline text-xs">刪除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function toggleSelectAll(master) {
            studentList.forEach(st => st.selected = master.checked);
            renderStudentTable();
            renderCertificates();
        }

        // 自動流水號產生
        function generateDocNo(index) {
            const prefix = document.getElementById('docPrefix').value;
            const startNum = document.getElementById('docStartNum').value.trim();
            
            if (startNum.includes('-')) {
                const parts = startNum.split('-');
                const base = parts[0];
                const sub = parseInt(parts[1], 10) || 1;
                return `${prefix}${base}-${sub + index}號`;
            } else {
                const num = parseInt(startNum, 10) || 1;
                return `${prefix}${num + index}號`;
            }
        }

        // 渲染證明書（確保圖層順序：官防最底、校長中間、文字最上）
        function renderCertificates() {
            const container = document.getElementById('pagesOutput');
            container.innerHTML = '';

            const selectedStudents = studentList.filter(s => s.selected);
            if (selectedStudents.length === 0) {
                container.innerHTML = '<div class="text-white text-center py-20 text-base">請至少勾選一位學生以產生證明書。</div>';
                return;
            }

            const schoolTitle = document.getElementById('schoolName').value;
            const termText = document.getElementById('termInput').value;
            const dateSpaced = getIssueDateMinguoSpaced();

            // 取得使用者微調的印章尺寸與位置
            const offW = document.getElementById('sealOffW').value;
            const offX = document.getElementById('sealOffX').value;
            const offY = document.getElementById('sealOffY').value;

            const prinW = document.getElementById('sealPrinW').value;
            const prinX = document.getElementById('sealPrinX').value;
            const prinY = document.getElementById('sealPrinY').value;

            // 每 2 人合併一張 A4
            for (let i = 0; i < selectedStudents.length; i += 2) {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'a4-page';

                const pair = [selectedStudents[i], selectedStudents[i + 1]];

                pair.forEach((st, pairIdx) => {
                    if (!st) {
                        const emptyCard = document.createElement('div');
                        emptyCard.className = 'cert-card opacity-0';
                        pageDiv.appendChild(emptyCard);
                        return;
                    }

                    const docNo = generateDocNo(i + pairIdx);
                    const bdayMinguo = toMinguoDate(st.birthday);
                    const gradeName = formatGrade(st.grade);

                    const card = document.createElement('div');
                    card.className = 'cert-card font-kai';

                    card.innerHTML = `
                        <!-- ==================== 圖層 1 & 2：印章層 (背景) ==================== -->
                        <div class="seals-overlay">
                            <!-- 最底層 (z-index: 10)：學校官防大印 -->
                            <img src="${officialSealData}" class="seal-official-img" style="width: ${offW}mm; left: ${offX}%; top: ${offY}%;" alt="官防">

                            <!-- 中間層 (z-index: 20)：校長簽名章 -->
                            <img src="${principalSealData}" class="seal-principal-img" style="width: ${prinW}mm; left: ${prinX}%; top: ${prinY}%;" alt="校長簽名">
                        </div>

                        <!-- ==================== 圖層 3：最上層所有文字與照片 (z-index: 30) ==================== -->
                        
                        <!-- 1. 學校抬頭 -->
                        <div class="layer-text text-center pt-2">
                            <h1 class="text-[26px] font-bold tracking-[3px] text-black">${schoolTitle}</h1>
                        </div>

                        <!-- 2. 文號 -->
                        <div class="layer-text text-right text-[15px] tracking-wide text-black pr-1 font-medium">
                            ${docNo}
                        </div>

                        <!-- 3. 本文區 (左照片 + 右正文) -->
                        <div class="layer-text flex items-start gap-6 px-3 my-auto">
                            <!-- 照片框 -->
                            <div class="w-[30mm] h-[40mm] border border-gray-400 bg-white flex items-center justify-center shrink-0 overflow-hidden shadow-sm">
                                ${st.photo ? 
                                    `<img src="${st.photo}" class="w-full h-full object-cover" alt="${st.name}">` : 
                                    `<span class="text-gray-400 text-xs">學生照片</span>`
                                }
                            </div>

                            <!-- 正文文字 (字距與行距比照範本) -->
                            <div class="text-[17.5px] leading-[2.2] tracking-wide text-black text-justify flex-1 pt-1">
                                查學生 <span class="text-[19px] font-bold px-1">${st.name}</span>(${st.idCard}) ， ${bdayMinguo}生， 現在本校${gradeName} ${termText}就讀屬實，特發給在學證明書以資證明。
                            </div>
                        </div>

                        <!-- 4. 此證 -->
                        <div class="layer-text text-[17.5px] font-bold pl-16 mb-4">
                            此證
                        </div>

                        <!-- 5. 發證日期 -->
                        <div class="layer-text text-center text-[17px] text-black font-semibold tracking-wider pb-1">
                            ${dateSpaced}
                        </div>
                    `;

                    pageDiv.appendChild(card);
                });

                container.appendChild(pageDiv);
            }
        }

        // 監聽基本設定即時刷新
        ['schoolName', 'docPrefix', 'docStartNum', 'termInput', 'issueDateInput'].forEach(id => {
            document.getElementById(id).addEventListener('input', renderCertificates);
        });
    </script>
</body>
</html>
